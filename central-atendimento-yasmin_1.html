<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Atendimento, Dra. Yasmin de Almeida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3d2e20;
    --brown:#6e5032;
    --brown-deep:#4a3826;
    --tan:#a88b6a;
    --cream:#faf6ef;
    --card:#ffffff;
    --sage:#7c8768;
    --sage-soft:#eef1e7;
    --line:#e9ded0;
    --chip:#f3ead9;
    --shadow:0 1px 2px rgba(74,56,38,.06),0 8px 24px rgba(74,56,38,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Figtree',system-ui,-apple-system,sans-serif;
    color:var(--ink);
    background:var(--cream);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brown)}

  /* ---- Sticky top bar (logo + campos principais) ---- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--cream);
    border-bottom:1px solid var(--line);
    padding:12px 16px 11px;
  }
  .topbar img{display:block;margin:2px auto 6px;max-width:225px;width:55%;height:auto}
  .app-title{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    text-align:center;color:var(--brown-deep);
    font-size:1.18rem;letter-spacing:.04em;margin:0 0 11px;
  }
  .wrap{max-width:1120px;margin:0 auto}
  .fields-main,.fields-more{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:10px;
  }
  .fields-more{margin-bottom:10px}
  .field-wide{margin-bottom:10px}
  .field label{
    display:block;
    font-size:.66rem;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--tan);margin-bottom:4px;
  }
  .field input{
    width:100%;padding:9px 11px;
    border:1px solid var(--line);border-radius:10px;
    background:var(--card);color:var(--ink);
    font-family:inherit;font-size:.92rem;
    transition:border-color .15s,box-shadow .15s;
  }
  .field input:focus{
    outline:none;border-color:var(--brown);
    box-shadow:0 0 0 3px rgba(110,80,50,.12);
  }
  .field.key input{border-color:var(--brown);background:#fffdf9}

  .search{position:relative}
  .search input{
    width:100%;padding:9px 11px 9px 34px;
    border:1px solid var(--line);border-radius:10px;background:var(--card);
    font-family:inherit;font-size:.92rem;color:var(--ink);
  }
  .search input:focus{outline:none;border-color:var(--brown);box-shadow:0 0 0 3px rgba(110,80,50,.12)}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--tan)}

  /* toggle "Mais opções" */
  .more-toggle{
    display:inline-flex;align-items:center;gap:6px;
    margin-top:11px;padding:7px 13px;
    border:1px solid var(--line);border-radius:999px;background:var(--card);
    color:var(--brown);font-family:inherit;font-weight:600;font-size:.82rem;cursor:pointer;
    transition:all .14s;
  }
  .more-toggle:hover{border-color:var(--tan)}
  .more-toggle .chev{width:15px;height:15px;transition:transform .22s}
  .more-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .more-panel{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .more-panel.open{max-height:460px}
  .more-inner{padding-top:11px}

  .pills{
    display:flex;gap:7px;flex-wrap:nowrap;margin-top:11px;
    overflow-x:auto;overflow-y:hidden;padding-bottom:4px;
    touch-action:pan-x;scrollbar-width:none;-webkit-overflow-scrolling:touch;
  }
  .pills::-webkit-scrollbar{display:none}
  .pill{
    flex:0 0 auto;
    border:1px solid var(--line);background:var(--card);
    color:var(--brown);font-family:inherit;font-size:.82rem;font-weight:600;
    padding:7px 13px;border-radius:999px;cursor:pointer;
    transition:all .14s;white-space:nowrap;
  }
  .pill:hover{border-color:var(--tan)}
  .pill.active{background:var(--brown);color:#fff;border-color:var(--brown)}

  /* ---- Content ---- */
  main{max-width:1120px;margin:0 auto;padding:22px 16px 60px}
  .group{margin-bottom:30px}
  .group-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
  .group-head h2{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:1.72rem;color:var(--brown-deep);margin:0;letter-spacing:.01em;
  }
  .group-head .count{font-size:.78rem;color:var(--tan);font-weight:500}
  .group-note{font-size:.82rem;color:var(--tan);margin:-6px 2px 14px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(min(100%, 300px),1fr));
    gap:14px;
  }
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px 16px 14px;display:flex;flex-direction:column;
    box-shadow:var(--shadow);
  }
  .card .eyebrow{
    display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;
  }
  .card .eb-label{
    font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--brown);display:flex;align-items:center;gap:7px;min-width:0;
  }
  .card .eb-label::before{content:"";width:14px;height:1.5px;background:var(--tan);border-radius:2px;flex:0 0 auto}
  .edited-tag{font-style:italic;text-transform:none;letter-spacing:0;font-weight:500;color:var(--sage);font-size:.9em}
  .icon-edit{
    flex:0 0 auto;background:none;border:none;cursor:pointer;color:var(--tan);
    padding:3px;border-radius:7px;display:inline-flex;transition:color .14s,background .14s;
  }
  .icon-edit:hover{color:var(--brown);background:var(--chip)}
  .icon-edit svg{width:16px;height:16px}
  .card.edited{border-color:#dcedd0}
  .card.dracard{background:#efe3cd;border-color:#cbb387}
  .card.intcard{background:#f5f3ef;border-color:#e0dace}
  .card.intcard .cbar{background:linear-gradient(180deg,#8a857f,#c9c5c0)}
  .card.intcard .msg{font-size:12px;color:#4a4640}
  .intbadge{font-style:normal;text-transform:none;letter-spacing:0;font-weight:600;color:#fff;background:#8a857f;font-size:8.5px;padding:2px 6px;border-radius:5px}
  .typetag{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--brown);background:var(--chip);border:1px solid #e6d6ba;padding:2px 9px;border-radius:6px;margin-bottom:9px}
  .card.dracard .cbar{background:linear-gradient(180deg,var(--brown-deep),var(--brown))}
  .drabadge{
    display:inline-flex;align-items:center;
    background:var(--brown);color:#fff;font-size:9.5px;font-weight:700;
    letter-spacing:.2px;text-transform:none;padding:2px 8px;border-radius:999px;
  }
  .edit-area{
    width:100%;min-height:160px;resize:vertical;
    border:1px solid var(--brown);border-radius:12px;padding:11px;
    font-family:inherit;font-size:.9rem;color:var(--ink);line-height:1.5;
    background:#fffdf9;margin-bottom:8px;
  }
  .edit-area:focus{outline:none;box-shadow:0 0 0 3px rgba(110,80,50,.12)}
  .edit-hint{font-size:.72rem;color:var(--tan);margin-bottom:11px;line-height:1.4}
  .btn-ghost{background:#fff;border:1px solid var(--line);color:var(--brown)}
  .btn-ghost:hover{border-color:var(--tan)}
  .msg{
    white-space:pre-wrap;font-size:.93rem;color:#4a3d30;
    flex:1;margin-bottom:13px;
    overflow-wrap:anywhere;word-break:break-word;
  }
  .msg .q{
    display:block;border-left:3px solid var(--tan);
    padding:2px 0 2px 10px;margin:3px 0;color:#5a4a38;
  }
  .msg i{font-style:italic}
  .msg b{font-weight:700;color:var(--brown-deep)}
  .msg .tok{
    background:var(--chip);color:var(--brown-deep);
    padding:1px 6px;border-radius:6px;font-weight:600;
    border:1px solid #e6d6ba;
  }
  .msg .tok.empty{background:var(--sage-soft);color:var(--sage);border-color:#d5ddc7;font-style:italic}

  .cardbtns{display:flex;gap:8px}
  .btn{
    font-family:inherit;font-weight:600;font-size:.85rem;
    border-radius:10px;cursor:pointer;padding:9px 12px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    transition:all .14s;border:1px solid transparent;
  }
  .btn svg{width:15px;height:15px}
  .btn-copy{flex:1;background:var(--brown);color:#fff}
  .btn-copy:hover{background:var(--brown-deep)}
  .btn-copy.done{background:var(--sage)}
  .btn-wa{background:#fff;border-color:var(--line);color:var(--sage);padding:9px 11px}
  .btn-wa:hover{border-color:var(--sage);background:var(--sage-soft)}

  .empty-state{text-align:center;color:var(--tan);padding:50px 20px;font-size:.95rem}

  /* ---- Toast ---- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--brown-deep);color:#fff;padding:11px 20px;border-radius:999px;
    font-size:.9rem;font-weight:500;box-shadow:0 8px 30px rgba(74,56,38,.28);
    opacity:0;pointer-events:none;transition:all .25s;z-index:50;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  footer{text-align:center;padding:26px 20px 44px;border-top:1px solid var(--line);margin-top:20px}
  .foot-brand{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--brown);font-weight:600;letter-spacing:.05em}
  .foot-contact{color:var(--brown-deep);font-size:.86rem;margin-top:3px;font-weight:500}
  .foot-note{color:var(--tan);font-size:.76rem;margin:10px auto 0;max-width:520px;line-height:1.45}

  @media (max-width:560px){
    .group-head h2{font-size:1.5rem}
    .topbar img{max-width:175px;width:58%;margin-bottom:9px}
    .topbar{padding:10px 14px 10px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const state = {assistente:"", paciente:"", data:"", link:"", fone:"", relato:"noites de sono melhores e crises menos intensas", queixa:"", busca:"", cat:"todos"};
const TOKENS = [
  {key:"assistente", label:"seu nome"},
  {key:"paciente",   label:"nome do paciente"},
  {key:"data",       label:"data / horário"},
  {key:"link",       label:"link da consulta"},
  {key:"relato",     label:"relato de melhora"},
  {key:"queixa",     label:"queixa do paciente"},
];

// edições de mensagens (ficam salvas no navegador onde o arquivo é usado)
const EDIT_KEY = "yasmin_msg_edits_v1";
let edits = {};
let editing = null;    // índice em edição
let editDraft = null;  // rascunho enquanto edita
try { const raw = localStorage.getItem(EDIT_KEY); if(raw){ edits = JSON.parse(raw) || {}; } } catch(e){ edits = {}; }
function saveEdits(){ try { localStorage.setItem(EDIT_KEY, JSON.stringify(edits)); } catch(e){} }
function getText(idx){ return (idx in edits) ? edits[idx] : MSGS[idx].text; }
function commitEdit(idx, val){
  if(val.trim() === MSGS[idx].text.trim()){ delete edits[idx]; }
  else { edits[idx] = val; }
  saveEdits();
}

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

// cabeçalho fixo no topo de toda mensagem
const HEADER = "*Equipe Dra. Yasmin*\n\n";

// plain text for copying / whatsapp (empty tokens -> readable bracket)
function resolvePlain(text){
  let t = HEADER + text;
  TOKENS.forEach(tok=>{
    const v = state[tok.key].trim();
    t = t.split("{"+tok.key+"}").join(v ? v : "["+tok.label+"]");
  });
  return t;
}
// html for preview (tokens highlighted)
function resolveHtml(text, wh){
  if(wh===undefined) wh=true;
  let t = esc((wh?HEADER:"") + text);
  TOKENS.forEach(tok=>{
    const v = state[tok.key].trim();
    const chip = v
      ? '<span class="tok">'+esc(v)+'</span>'
      : '<span class="tok empty">['+tok.label+']</span>';
    t = t.split("{"+tok.key+"}").join(chip);
  });
  t = t.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  t = t.replace(/_([^_\n]+)_/g, "<i>$1</i>");
  const lines = t.split("\n");
  const out = []; let quote = [];
  const flush = () => { if(quote.length){ out.push('<span class="q">'+quote.join("<br>")+'</span>'); quote=[]; } };
  lines.forEach(ln=>{
    const m = ln.match(/^&gt;\s?(.*)$/);
    if(m){ quote.push(m[1]); } else { flush(); out.push(ln); }
  });
  flush();
  return out.join("\n");
}

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove("show"),1600);
}

function copyText(text, btn){
  const done = ()=>{
    toast("Mensagem copiada ✅");
    const old = btn.innerHTML;
    btn.classList.add("done");
    btn.innerHTML = iconCheck()+" Copiado";
    setTimeout(()=>{btn.classList.remove("done");btn.innerHTML=old;},1500);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  } else { fallbackCopy(text,done); }
}
function fallbackCopy(text,cb){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");cb();}catch(e){toast("Não consegui copiar 😕");}
  document.body.removeChild(ta);
}
function openWhats(text){
  const num = state.fone.replace(/\D/g,"");
  const base = num ? "https://wa.me/"+num : "https://wa.me/";
  window.open(base+"?text="+encodeURIComponent(text),"_blank");
}

function render(){
  const content = document.getElementById("content");
  if(editing!==null){ const ta=document.getElementById("edit-"+editing); if(ta){ editDraft = ta.value; } }
  content.innerHTML = "";
  const q = state.busca.trim().toLowerCase();
  const cats = state.cat==="todos" ? CATS.filter(c=>c.id!=="dra" && c.id!=="orientacoes" && c.id!=="emocional").map(c=>c.id) : [state.cat];
  let total = 0;

  cats.forEach(cid=>{
    let items = (cid==="dra") ? MSGS.filter(m=>m.dra) : (cid==="emocional") ? MSGS.filter(m=>m.emocional) : MSGS.filter(m=>m.cat===cid);
    if(q){
      items = items.filter(m=>
        (m.label+" "+m.text).toLowerCase().includes(q));
    }
    if(!items.length) return;
    total += items.length;

    const cat = CATS.find(c=>c.id===cid);
    const group = document.createElement("section");
    group.className="group";
    let head = '<div class="group-head"><h2>'+cat.label+'</h2>'+
               '<span class="count">'+items.length+'</span></div>';
    const NOTES = {
      duvidas:"Respostas prontas para as dúvidas mais comuns dos pacientes.",
      benef:"Benefícios possíveis, sem garantia de resultado. A indicação é sempre individual, feita pela Dra.",
      objecoes:"Respostas rápidas para as objeções mais comuns, sem pressão.",
      dra:"As mensagens no jeito que a Dra. Yasmin gosta, ajustadas por ela.",
      orientacoes:"Guia interno do secretariado. Uso da equipe, não é mensagem para o paciente.",
      acolhimento:"Mensagens humanas para acolher quem chega com ansiedade, insônia ou depressão.",
      emocional:"Bloco reunido de ansiedade, insônia e depressão. As mensagens também aparecem nas abas de origem.",
      comofunciona:"Explica o acompanhamento, os pacotes e os modelos de atendimento.",
      followup:"Sequência leve para reengajar quem ainda não respondeu, sem cobrança.",
      reconexao:"Reconquistar quem conversou mas não fechou, com técnicas consultivas e sem pressão.",
      retencao:"Mensagens para acompanhar, cuidar e fidelizar o paciente.",
      confirmacao:"Confirmação de presença nos dois formatos: presencial e on-line.",
      dados:"Informações da Dra. para enviar rápido quando o paciente precisar."
    };
    if(NOTES[cid]){
      head += '<p class="group-note">'+NOTES[cid]+'</p>';
    }
    let cards = '<div class="grid">';
    items.forEach((m)=>{
      const idx = MSGS.indexOf(m);
      const editedTag = (idx in edits) ? ' <em class="edited-tag">editada</em>' : '';
      const draCls = m.dra ? ' dracard' : '';
      const draBadge = m.dra ? ' <span class="drabadge">Ajustada pela Dra. Yasmin</span>' : '';
      const catLabel = (CATS.find(c=>c.id===m.cat)||{}).label || '';
      const typeTag = '<div class="typetag">'+esc(catLabel)+'</div>';
      if(editing === idx){
        const draft = (editDraft !== null) ? editDraft : getText(idx);
        cards +=
          '<div class="card editing'+draCls+'">'+
            '<div class="eyebrow"><span class="eb-label">'+esc(m.label)+draBadge+editedTag+'</span></div>'+
            '<textarea class="edit-area" id="edit-'+idx+'">'+esc(draft)+'</textarea>'+
            '<div class="edit-hint">Use {paciente}, {data}, {link} • *negrito*, _itálico_, &gt; citação</div>'+
            '<div class="cardbtns">'+
              '<button class="btn btn-copy" data-save="'+idx+'">'+iconCheck()+' Salvar</button>'+
              '<button class="btn btn-ghost" data-cancel="'+idx+'">Cancelar</button>'+
              ((idx in edits) ? '<button class="btn btn-ghost" data-reset="'+idx+'">Restaurar</button>' : '')+
            '</div>'+
          '</div>';
      } else if(m.internal){
        cards +=
          '<div class="card intcard'+((idx in edits)?' edited':'')+'">'+
            typeTag+
            '<div class="eyebrow">'+
              '<span class="eb-label">'+esc(m.label)+' <span class="intbadge">Uso interno</span>'+editedTag+'</span>'+
              '<button class="icon-edit" data-edit="'+idx+'" title="Editar">'+iconEdit()+'</button>'+
            '</div>'+
            '<div class="msg intmsg">'+resolveHtml(getText(idx), false)+'</div>'+
          '</div>';
      } else {
        cards +=
          '<div class="card'+draCls+((idx in edits)?' edited':'')+'">'+
            typeTag+
            '<div class="eyebrow">'+
              '<span class="eb-label">'+esc(m.label)+draBadge+editedTag+'</span>'+
              '<button class="icon-edit" data-edit="'+idx+'" title="Editar mensagem">'+iconEdit()+'</button>'+
            '</div>'+
            '<div class="msg">'+resolveHtml(getText(idx))+'</div>'+
            '<div class="cardbtns">'+
              '<button class="btn btn-copy" data-copy="'+idx+'">'+iconCopy()+' Copiar</button>'+
              '<button class="btn btn-wa" data-wa="'+idx+'" title="Abrir no WhatsApp">'+iconWa()+'</button>'+
            '</div>'+
          '</div>';
      }
    });
    cards += '</div>';
    group.innerHTML = head + cards;
    content.appendChild(group);
  });

  if(!total){
    content.innerHTML = '<div class="empty-state">Nenhuma mensagem encontrada para essa busca.</div>';
  }
}

document.getElementById("busca").addEventListener("input",e=>{
  state.busca=e.target.value; editing=null; editDraft=null; render();
});

function buildPills(){
  const box=document.getElementById("pills");
  const all=[{id:"todos",label:"Todas"}].concat(CATS);
  box.innerHTML = all.map(c=>
    '<button class="pill'+(c.id===state.cat?' active':'')+'" data-cat="'+c.id+'">'+c.label+'</button>'
  ).join("");
  box.querySelectorAll(".pill").forEach(p=>{
    p.addEventListener("click",()=>{
      state.cat=p.dataset.cat; editing=null; editDraft=null;
      box.querySelectorAll(".pill").forEach(x=>x.classList.toggle("active",x===p));
      render();
    });
  });
}

document.addEventListener("click",e=>{
  const c=e.target.closest("[data-copy]");
  const w=e.target.closest("[data-wa]");
  const ed=e.target.closest("[data-edit]");
  const sv=e.target.closest("[data-save]");
  const cn=e.target.closest("[data-cancel]");
  const rs=e.target.closest("[data-reset]");
  if(c){ copyText(resolvePlain(getText(+c.dataset.copy)), c); }
  if(w){ openWhats(resolvePlain(getText(+w.dataset.wa))); }
  if(ed){ editing = +ed.dataset.edit; editDraft = null; render(); const ta=document.getElementById("edit-"+editing); if(ta){ ta.focus(); } }
  if(sv){ const idx=+sv.dataset.save; const ta=document.getElementById("edit-"+idx); if(ta){ commitEdit(idx, ta.value); } editing=null; editDraft=null; render(); toast("Mensagem salva ✏️"); }
  if(cn){ editing=null; editDraft=null; render(); }
  if(rs){ const idx=+rs.dataset.reset; delete edits[idx]; saveEdits(); editing=null; editDraft=null; render(); toast("Texto original restaurado"); }
});

// toggle "Mais opções"
const moreToggle = document.getElementById("moreToggle");
const morePanel  = document.getElementById("morePanel");
const moreLabel  = document.getElementById("moreLabel");
moreToggle.addEventListener("click",()=>{
  const open = morePanel.classList.toggle("open");
  moreToggle.setAttribute("aria-expanded", open ? "true" : "false");
  moreLabel.textContent = open ? "Menos opções" : "Mais opções";
});

buildPills();
render();
</script>
</body>
</html>
